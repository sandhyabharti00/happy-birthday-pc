<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday PC</title>
<style>
body{
margin:0;
overflow:hidden;
font-family:Arial,sans-serif;
background:linear-gradient(135deg,#240046,#5a189a,#9d4edd);
color:white;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
text-align:center;
}
.container{position:relative;z-index:2;padding:20px}
h1{
font-size:3rem;
animation:glow 2s infinite alternate;
}
img{
width:min(90vw,320px);
border-radius:20px;
border:4px solid white;
box-shadow:0 10px 25px rgba(0,0,0,.4);
margin:20px 0;
}
.message{font-size:1.2rem;margin-bottom:18px}
button{
padding:14px 28px;
border:none;
border-radius:30px;
background:#ff4fa3;
color:white;
font-size:18px;
cursor:pointer;
}
button:hover{background:#ff2f92}
@keyframes glow{
from{text-shadow:0 0 10px #fff,0 0 20px #ff80bf}
to{text-shadow:0 0 20px #fff,0 0 40px #ff4fa3}
}
.confetti{
position:absolute;
top:-20px;
font-size:22px;
animation:fall linear infinite;
opacity:.9;
}
@keyframes fall{
to{transform:translateY(110vh) rotate(720deg);}
}
</style>
</head>
<body>

<div id="confetti"></div>

<div class="container">
<h1>🎉 HAPPY BIRTHDAY PC 🎉</h1>

<img src="images/photo4.jpg" alt="Birthday Photo">

<div class="message">
May your smile always shine this brightly. ❤️<br>
Love you loads!<br><strong>— Sandhya</strong>
</div>

<button onclick="location.href='index.html'">🔁 Replay Journey</button>
</div>

<script>
const holder=document.getElementById('confetti');
const items=['🎉','🎊','✨','🎈','❤️','💖'];
for(let i=0;i<80;i++){
 const s=document.createElement('span');
 s.className='confetti';
 s.textContent=items[Math.floor(Math.random()*items.length)];
 s.style.left=Math.random()*100+'vw';
 s.style.animationDuration=(4+Math.random()*6)+'s';
 s.style.animationDelay=(Math.random()*5)+'s';
 holder.appendChild(s);
}
</script>

</body>
</html>
