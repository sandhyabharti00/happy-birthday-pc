<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Letter</title>
<style>
body{
margin:0;
background:linear-gradient(135deg,#2a004d,#6a0572);
font-family:Arial,sans-serif;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
overflow:hidden;
}
.card{
background:rgba(255,255,255,.12);
backdrop-filter:blur(10px);
padding:30px;
border-radius:20px;
width:min(90vw,700px);
color:white;
box-shadow:0 10px 30px rgba(0,0,0,.4);
}
h1{text-align:center}
#text{white-space:pre-wrap;line-height:1.8;font-size:18px;min-height:420px}
button{
display:none;
margin:20px auto 0;
padding:14px 30px;
background:#ff4fa3;
color:white;
border:none;
border-radius:30px;
font-size:18px;
cursor:pointer;
}
.petals span{
position:absolute;
top:-20px;
font-size:20px;
animation:fall linear infinite;
}
@keyframes fall{
to{transform:translateY(110vh) rotate(360deg);}
}
</style>
</head>
<body>

<div class="petals">
<span style="left:10%;animation-duration:8s;">🌸</span>
<span style="left:35%;animation-duration:11s;">🌸</span>
<span style="left:60%;animation-duration:9s;">🌸</span>
<span style="left:85%;animation-duration:10s;">🌸</span>
</div>

<div class="card">
<h1>💌 A Letter From My Heart</h1>
<div id="text"></div>
<button id="next" onclick="location.href='celebration.html'">🎂 Celebrate</button>
</div>

<script>
const msg="Happy Birthday to my favourite girl!\n\nTu meri best friend hi nahi, meri safe place, meri biggest happiness aur meri life ka sabse beautiful part hai. Tere saath har chhota moment bhi special ban jaata hai.\n\nMeri dua hai ki teri life hamesha happiness, love, success aur endless smiles se bhari rahe. Jo bhi tu dil se chahe, woh sab tujhe mile. Kabhi kisi cheez ki kami na ho, aur teri cute si smile hamesha isi tarah chamakti rahe.\n\nThank you for always being there, for understanding me without words, and for making life so much brighter.\n\nI'm really lucky to have a best friend like you.\n\nStay happy, stay blessed, and never stop being the amazing person you are.\n\nHappy Birthday once again, Bestie! 🥹💐🎉\n\nLove you loads ❤️\n— Sandhya";
const text=document.getElementById("text");
const btn=document.getElementById("next");
let i=0;
function type(){
 if(i<msg.length){
   text.textContent+=msg.charAt(i);
   i++;
   setTimeout(type,25);
 }else{
   btn.style.display='block';
 }
}
type();
</script>

</body>
</html>
